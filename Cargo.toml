[package]
name = "ptt-mic"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
evdev = "0.12"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
